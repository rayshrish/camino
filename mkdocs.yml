site_name: camino documentation
docs_dir: docs/
site_description: Documentation for CAMINO, a Python package for modelling and inferring wavefront aberrations from JWST/NIRCam observations.
site_author: rayshrish
site_url: https://rayshrish.github.io/camino/
repo_url: https://github.com/rayshrish/camino
repo_name: rayshrish/camino
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - toc.integrate
    - content.action.edit
    - content.action.view
  palette:
    - scheme: default
      primary: amber
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: amber
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

strict: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: "numpy"
            show_root_heading: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [".", "docs"]
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: "¤"
      toc_depth: 2
  - attr_list
  - md_in_html

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Concepts & Workflow: concepts.md
  - Worked Example: examples/worked_example.md

  - API:
    - CAMINO API:
      - Image Ops: API/camino/image_ops.md
      - Smoothing: API/camino/smoothing.md
      - Layers: API/camino/layers.md
      - Propagation: API/camino/propagation.md
      - Exposures: API/camino/exposures.md
      - Filters: API/camino/filters.md
      - Fitting: API/camino/fitting.md
      - Solvers: API/camino/solvers.md
      - Diagnostics: API/camino/diagnostics.md
    - ABCDLux patch API:
      - Abcd Matrices: API/abcdlux_patch/abcd_matrices.md
      - Coords: API/abcdlux_patch/coords.md
      - Curvature: API/abcdlux_patch/curvature.md
      - Mft: API/abcdlux_patch/mft.md
      - Lct: API/abcdlux_patch/lct.md
