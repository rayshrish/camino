[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jwst-camino"
version = "0.0.5"
description = "CAMINO is a Python package for modelling and inferring wavefront aberrations from JWST/NIRCam observations."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }
authors = [{ name = "rayshrish" }]
keywords = [
  "python",
  "jax",
  "autodiff",
  "optics",
  "wavefront",
  "jwst",
  "nircam",
  "camino",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "astropy>=5.0",
  "jax>=0.11.1",
  "pandas>=1.5",
  "equinox>=0.13.8",
  "zodiax>=0.5.0",
  "optax>=0.2.8",
  "dLux>=0.15.1",
  "scikit-image",
  "tqdm",
  "matplotlib",
  "stpsf",
  "astroquery",
]

[project.optional-dependencies]
tests = [
  "pytest",
  "pytest-cov",
]

dev = [
  "pytest",
  "pytest-cov",
  "black",
  "ruff",
  "pre-commit",
  "zensical",
  "mkdocstrings-python",
  "nbconvert",
  "jupyter",
]

profile = [
  "xprof",
]

[project.urls]
Homepage = "https://github.com/rayshrish/camino"
Documentation = "https://rayshrish.github.io/camino/"
Issues = "https://github.com/rayshrish/camino/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
camino = ["data/*.fits", "data/*.dat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
  "E402",
  "E501",
  "E731",
  "E741",
  "F722",
  "I001",
]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2
